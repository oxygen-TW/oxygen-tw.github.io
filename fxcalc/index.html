            'BAM', 'BBD', 'BDT', 'BGN', 'BHD', 'BIF', 'BMD', 'BND', 'BOB', 'BRL', 'BSD', 'BTN', 'BWP', 'BYN', 'BZD',

            'SAR', 'SBD', 'SCR', 'SDG', 'SEK', 'SGD', 'SHP', 'SLE', 'SLL', 'SOS', 'SRD', 'STN', 'SVC', 'SYP', 'SZL',
            'THB', 'TJS', 'TMT', 'TND', 'TOP', 'TRY', 'TTD', 'TVD', 'TWD', 'TZS',
            'UAH', 'UGX', 'USD', 'UYU', 'UZS',
            'VED', 'VES', 'VND', 'VUV',
            'WST',

        // 預設值定義
        const defaultValues = {
            fromCurrency: 'USD',

            cashRate: '',

            visaReward: '2.2',

        // Cookie 操作函數
        function setCookie(name, value, days) {
            let expires = "";
            if (days) {
                const date = new Date();
                date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
                expires = "; expires=" + date.toUTCString();
            }
            document.cookie = name + "=" + (value || "") + expires + "; path=/; Secure; SameSite=Lax";
        }

        function getCookie(name) {
            const nameEQ = name + "=";
            const ca = document.cookie.split(';');
            for (let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) === ' ') c = c.substring(1, c.length);
                if (c.indexOf(nameEQ) === 0) return c.substring(nameEQ.length, c.length);
            }
            return null;
        }

        // 儲存所有設定到 Cookie（除了金額）
        function saveAllSettings() {
            const settingsToSave = [
                'fromCurrency', 'toCurrency', 'cashRate', 
                'visaFee', 'visaReward', 'masterFee', 'masterReward'
            ];
            
            settingsToSave.forEach(fieldId => {
                const element = document.getElementById(fieldId);
                if (element && element.value) {
                    setCookie(fieldId, element.value, 30); // 保存30天
                }
            });
        }

        // 從 Cookie 載入所有設定
        function loadAllSettings() {
            Object.keys(defaultValues).forEach(fieldId => {
                const element = document.getElementById(fieldId);
                const savedValue = getCookie(fieldId);
                
                if (element) {
                    if (savedValue !== null) {
                        element.value = savedValue;
                    } else {
                        element.value = defaultValues[fieldId];
                    }
                }
            });
        }

        // 清除所有 Cookie 並還原預設值
        function clearAllSettings() {
            // 清除所有相關的 Cookie
            Object.keys(defaultValues).forEach(fieldId => {
                setCookie(fieldId, '', -1); // 設定過期時間為過去，刪除 Cookie
            });
            
            // 還原所有欄位到預設值
            Object.keys(defaultValues).forEach(fieldId => {
                const element = document.getElementById(fieldId);
                if (element) {
                    element.value = defaultValues[fieldId];
                }
            });
            
            // 清空金額欄位
            document.getElementById('amount').value = '';
            
            // 隱藏結果區域
            document.getElementById('results').style.display = 'none';
            
            // 顯示提示訊息
            console.log('所有設定已清除並還原為預設值');
        }

        // 初始化貨幣選項
        function initializeCurrencyOptions() {
            const fromSelect = document.getElementById('fromCurrency');
            const toSelect = document.getElementById('toCurrency');
            
            currencies.forEach(currency => {
                const option1 = document.createElement('option');
                option1.value = currency;
                option1.textContent = currency;
                fromSelect.appendChild(option1);
                
                const option2 = document.createElement('option');
                option2.value = currency;
                option2.textContent = currency;
                toSelect.appendChild(option2);
            });
            
            // 載入儲存的設定
            loadAllSettings();
            
            // 監聽所有相關欄位的變化，儲存到 Cookie（除了金額）
            const fieldsToWatch = [
                'fromCurrency', 'toCurrency', 'cashRate', 
                'visaFee', 'visaReward', 'masterFee', 'masterReward'
            ];
            
            fieldsToWatch.forEach(fieldId => {
                const element = document.getElementById(fieldId);
                if (element) {
                    element.addEventListener('change', saveAllSettings);
                    element.addEventListener('input', saveAllSettings);
                }
            });
        }

        // VISA 匯率 API 呼叫
        async function visa_fx(fromCurrency, toCurrency, amount = 100, fee = 1.5) {
            try {
                const today = new Date();
                const dateString = String(today.getUTCMonth() + 1).padStart(2, '0') + '/' + 
                                String(today.getUTCDate()).padStart(2, '0') + '/' + 
                                today.getUTCFullYear();
                
                const params = new URLSearchParams({
                    amount: amount,
                    fee: fee,
                    utcConvertedDate: dateString,
                    exchangedate: dateString,
                    toCurr: fromCurrency,
                    fromCurr: toCurrency
                });

                const response = await fetch(`https://usa.visa.com/cmsapi/fx/rates?${params}`, {
                    // method: 'GET',
                    // headers: {
                    //     'User-Agent': 'Mozilla/5.0',
                    //     'Accept': 'application/json, text/plain, */*'
                    // }
                });

                if (!response.ok) {
                    throw new Error(`VISA API Error: ${response.status} ${response.statusText}`);
                }

                const data = await response.json();
                
                return {
                    rate: data.originalValues.fxRateWithAdditionalFee,
                    convertedAmount: data.originalValues.toAmountWithAdditionalFee,
                    convertedAmountWoFee: data.originalValues.toAmountWithVisaRate,
                    fee: data.conversionBankFee,
                    currency: data.originalValues.toCurrency,
                    timestamp: new Date().toISOString(),
                    success: true
                };
            } catch (error) {
                console.error('VISA API Error:', error);
                // 回傳模擬數據作為備援
                return {
                    rate: 30.5,
                    convertedAmount: amount * 30.5 * (1 + fee / 100),
                    convertedAmountWoFee: amount * 30.5,
                    fee: fee,
                    currency: toCurrency,
                    timestamp: new Date().toISOString(),
                    success: false,
                    error: error.message
                };
            }
        }

        // MasterCard 匯率 API 呼叫
        async function master_fx(fromCurrency, toCurrency, amount = 100, fee = 1.5) {
            try {
                const today = new Date();
                const dateString = String(today.getUTCDate()).padStart(2, '0') + '/' + 
                                String(today.getUTCMonth() + 1).padStart(2, '0') + '/' + 
                                today.getUTCFullYear();

                const requestBody = {
                    transactionDetails: {
                        transactionDate: dateString,
                        currencyType: fromCurrency,
                        amount: amount
                    },
                    cardDetails: {
                        currencyType: toCurrency,
                        amount: 0, // 由API計算
                        bankFee: fee
                    }
                };

                const response = await fetch('https://www.creation.co.uk/api-mastercard/convert', {
                    method: 'POST',
                    headers: {
                        'User-Agent': 'Mozilla/5.0',
                        'Accept': 'application/json, text/plain, */*',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(requestBody)
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`MasterCard API Error: ${response.status} ${response.statusText} - ${errorText}`);
                }

                const data = await response.json();
                
                return {
                    rate: data.response.mastercard.mastercardConvRateExclAllFees,
                    convertedAmount: parseFloat(data.response.mastercard.crdhldBillAmtInclAllFees),
                    convertedAmountWoFee: parseFloat(data.response.mastercard.crdhldBillAmtExclAllFees),
                    //transactionAmount: parseFloat(data.response.mastercard.crdhldBillAmtInclAllFees),
                    currency: data.response.transCurr,
                    timestamp: new Date().toISOString(),
                    success: true
                };
            } catch (error) {
                console.error('MasterCard API Error:', error);
                
                // 回傳模擬數據作為備援
                return {
                    rate: 30.6,
                    convertedAmount: amount * 30.6 * (1 + fee / 100),
                    convertedAmountWoFee: amount * 30.6,
                   // transactionAmount: amount,
                    currency: toCurrency,
                    timestamp: new Date().toISOString(),
                    success: false,
                    error: error.message
                };
            }
        }

        // 計算轉換結果
        async function calculateConversion() {
            const amount = parseFloat(document.getElementById('amount').value);

            //Check if cashRate is provided, if so, hasCashRate will be true
            const hasCashRate = document.getElementById('cashRate').value.trim() !== '';
            //console.log('hasCashRate:', hasCashRate);
            
            let cashRate = 0.0;
            let cashAmount = 0.0 ;
            //Cash rate is only used if hasCashRate is true
            if(hasCashRate) {
                cashRate = parseFloat(document.getElementById('cashRate').value);
                cashAmount = amount * cashRate;
            }
            //console.log('cashRate:', cashRate);

            const visaFee = parseFloat(document.getElementById('visaFee').value);
            const masterFee = parseFloat(document.getElementById('masterFee').value);
            const visaReward = parseFloat(document.getElementById('visaReward').value);
            const masterReward = parseFloat(document.getElementById('masterReward').value);
            const fromCurrency = document.getElementById('fromCurrency').value;
            const toCurrency = document.getElementById('toCurrency').value;


            // 獲取信用卡匯率（實際API呼叫）
            const visaData = await visa_fx(fromCurrency, toCurrency, amount, visaFee);
            const masterData = await master_fx(fromCurrency, toCurrency, amount, masterFee);

            const visaRate = parseFloat(visaData.rate);
            const masterRate = parseFloat(masterData.rate);

            // 計算信用卡轉換（考慮回饋）
            // VISA: 使用API回傳的已含手續費金額，再扣除回饋
            const visaAmountWoFee = visaData.convertedAmountWoFee;
            const visaAmountWithReward = visaData.convertedAmount - (visaAmountWoFee * (visaReward / 100));
            //const visaEffectiveRate = visaAmountWithReward / amount;

            // MasterCard: 使用API回傳的已含手續費金額，再扣除回饋
            const masterAmountWoFee = masterData.convertedAmountWoFee;
            const masterAmountWithReward = masterData.convertedAmount - (masterAmountWoFee * (masterReward / 100));
            //const masterEffectiveRate = masterAmountWithReward / amount;

            // 顯示結果
            displayResults({
                cash: { rate: cashRate, amount: cashAmount },
                visa: { 
                    rate: visaRate, 
                    amount: visaAmountWithReward, 
                    originalRate: visaData.rate,
                    success: visaData.success,
                    error: visaData.error 
                },
                master: { 
                    rate: masterRate, 
                    amount: masterAmountWithReward, 
                    originalRate: masterData.rate,
                    success: masterData.success,
                    error: masterData.error 
                },
                fromCurrency,
                toCurrency
            });
        }

        // 顯示轉換結果
        function displayResults(data) {

            if(data.cash.rate != 0.0){
                document.getElementById("cashResult").style.display="";
                document.getElementById('cashRateDisplay').textContent = `匯率: ${data.cash.rate.toFixed(4)}`;
                document.getElementById('cashAmount').textContent = `${data.cash.amount.toFixed(2)} ${data.toCurrency}`;
            }
            else{
                document.getElementById("cashResult").style.display="none";
            }

            // VISA 結果顯示
            let visaRateText = `有效匯率: ${data.visa.rate.toFixed(4)}`;
            if (!data.visa.success) {
                document.getElementById('visaRateDisplay').textContent = "API異常";
                document.getElementById('visaAmount').textContent = "無法計算匯率";
            }
            else{
                document.getElementById('visaRateDisplay').textContent = visaRateText;
                document.getElementById('visaAmount').textContent = `${data.visa.amount.toFixed(2)} ${data.toCurrency}`;
            }
            
            // 設定VISA API狀態指示器
            const visaStatus = document.getElementById('visaStatus');
            if (data.visa.success) {
                visaStatus.className = 'api-status';
                visaStatus.title = 'API連線正常';
            } else {
                visaStatus.className = 'api-status error';
                visaStatus.title = `API連線失敗: ${data.visa.error || '未知錯誤'}`;
            }

            // MasterCard 結果顯示
            let masterRateText = `有效匯率: ${data.master.rate.toFixed(4)}`;
            if (!data.master.success) {
                document.getElementById('masterRateDisplay').textContent = "API異常";
                document.getElementById('masterAmount').textContent = "無法計算匯率";
            }
            else{
                document.getElementById('masterRateDisplay').textContent = masterRateText;
                document.getElementById('masterAmount').textContent = `${data.master.amount.toFixed(2)} ${data.toCurrency}`;
            }
            
            // 設定MasterCard API狀態指示器
            const masterStatus = document.getElementById('masterStatus');
            if (data.master.success) {
                masterStatus.className = 'api-status';
                masterStatus.title = 'API連線正常';
            } else {
                masterStatus.className = 'api-status error';
                masterStatus.title = `API連線失敗: ${data.master.error || '未知錯誤'}`;
            }

            // 如果有API錯誤，在控制台顯示詳細信息
            if (!data.visa.success && data.visa.error) {
                console.warn('VISA API failed:', data.visa.error);
            }
            if (!data.master.success && data.master.error) {
                console.warn('MasterCard API failed:', data.master.error);
            }

            document.getElementById('results').style.display = 'block';
            document.getElementById('results').scrollIntoView({ behavior: 'smooth' });
        }

        // 表單提交處理
        document.getElementById('converterForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const submitBtn = document.querySelector('.btn-convert');
            const originalText = submitBtn.innerHTML;
            
            // 顯示載入狀態
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>計算中...';
            submitBtn.disabled = true;
            
            try {
                await calculateConversion();
            } catch (error) {
                alert('計算過程中發生錯誤，請稍後再試。');
                console.error('Conversion error:', error);
            } finally {
                // 恢復按鈕狀態
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            }
        });
        
        //When clearSerringsBtn is clicked, clear all settings
        document.getElementById('clearSettingsBtn').addEventListener('click', function() {
            clearAllSettings();
        });

        // 頁面載入完成後初始化
        document.addEventListener('DOMContentLoaded', function() {
            initializeCurrencyOptions();
        });
    </script>
</body>
</html>
